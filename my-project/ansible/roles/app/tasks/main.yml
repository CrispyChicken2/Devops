---
- name: Run Spring Boot App Container
  docker_container:
    name: tp-api
    image: crispychicken02/java-simple-api:1.0
    networks:
      - name: app-network
    env:
      DB_HOST: "database-1"
      DB_NAME: "db"
      DB_USER: "usr"
      DB_PASSWORD: "pwd"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://database-1:5432/db"
      SPRING_DATASOURCE_USERNAME: "usr"
      SPRING_DATASOURCE_PASSWORD: "pwd"
    restart_policy: always
    state: started
