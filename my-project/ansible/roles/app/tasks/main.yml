---
- name: Run Spring Boot App Containers
  docker_container:
    name: "{{ item }}"
    image: "{{ dockerhub_username }}/tp-devops-simple-api:latest"
    pull: true
    recreate: true
    networks:
      - name: app-network
    env:
      DB_HOST: "database-1"
      DB_NAME: "{{ postgres_db }}"
      DB_USER: "{{ postgres_user }}"
      DB_PASSWORD: "{{ postgres_password }}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://database-1:5432/{{ postgres_db }}"
      SPRING_DATASOURCE_USERNAME: "{{ postgres_user }}"
      SPRING_DATASOURCE_PASSWORD: "{{ postgres_password }}"
    restart_policy: always
    state: started
  loop:
    - backend-1
    - backend-2
