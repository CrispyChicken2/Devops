---
- name: Run Spring Boot App Container
  docker_container:
    name: tp-api
    image: crispychicken02/java-simple-api:1.0
    networks:
      - name: app-network
    env:
      DB_HOST: "database-1"
      DB_NAME: "{{ postgres_db }}"
      DB_USER: "{{ postgres_user }}"
      DB_PASSWORD: "{{ postgres_password }}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://database-1:5432/{{ postgres_db }}"
      SPRING_DATASOURCE_USERNAME: "{{ postgres_user }}"
      SPRING_DATASOURCE_PASSWORD: "{{ postgres_password }}"
    restart_policy: always
    state: started
