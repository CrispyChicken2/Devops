name: CI devops 2026

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 12
          cache: npm
          cache-dependency-path: my-project/ansible/devops-front-main/package.json

      - name: Install dependencies
        working-directory: my-project/ansible/devops-front-main
        run: npm install

      - name: Build frontend
        working-directory: my-project/ansible/devops-front-main
        run: npm run build

  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test with Maven
        working-directory: TP1/simpleapi
        run: mvn -B clean verify

  sonarcloud-analysis:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-24.04
    steps:
      # L'étape cruciale corrigée ici : on récupère tout l'historique Git pour Sonar
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Analyze with SonarCloud
        working-directory: TP1/simpleapi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Passé proprement en variable d'environnement
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION_KEY }}
          -Dsonar.host.url=https://sonarcloud.io